services:
  # PostgreSQL database
  - type: pgsql
    name: discord-replica-db
    plan: free
    database: discord_replica

  # WebSocket + API server
  - type: web
    name: discord-replica-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate && npx tsc
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: discord-replica-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: PORT
        value: 3001

  # React static site (client)
  - type: static_site
    name: discord-replica-client
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
